<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title and page.title != site.title %}{{ page.title }} &middot; {{ site.title }}{% else %}{{ site.title }} &middot; Software architect{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="keywords" content="{{ site.keywords }}">
  <meta name="author" content="{{ site.author }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

  <meta content="website" property="og:type">
  <meta content="{{ site.title }}" property="og:site_name">
  <meta content="{{ site.title }}" property="og:title">
  <meta content="{{ site.description }}" property="og:description">
  <meta content="{{ site.url }}" property="og:url">
  <meta content="{{ site.image | absolute_url }}" property="og:image">
  <meta name="twitter:card" content="summary">

  <link rel="icon" sizes="16x16 32x32" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="256x256" href="favicon.png">

  <!-- O peso 400 latin cobre praticamente todo o texto da pagina; os demais subsets
       sao buscados sob demanda pelo unicode-range declarado em main.css. -->
  <link rel="preload" href="{{ "/fonts/poppins-400-latin.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>

  <!-- Tema: precisa rodar antes da primeira pintura, senao pisca o tema errado. -->
  <script>
    (function () {
      var d = document.documentElement;
      d.classList.remove('no-js');
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') { d.setAttribute('data-theme', t); }
      } catch (e) { /* localStorage bloqueado: segue o prefers-color-scheme */ }
    })();
  </script>

  <meta name="theme-color" content="#{{ site.color.light-bg }}" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#{{ site.color.dark-bg }}" media="(prefers-color-scheme: dark)">

  <!-- Folha unica, inline: uma requisicao a menos e nada bloqueando a renderizacao.
       Alternativa externa (desativada): style.css + _layouts/style.css. -->
  <style>
    {% include css/main.css %}
  </style>
</head>
