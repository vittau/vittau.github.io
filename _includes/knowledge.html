<!-- Secao Technologies. Dados em _data/tech.yml, arte em _includes/tech-sprite.html. -->
<section class="section" id="tech">
  <div class="container">
    <div class="section-head section-head--center reveal">
      <h2>Technologies</h2>
      <p>The stack I build with, day to day.</p>
    </div>

    {% for group in site.data.tech.groups %}
    <div class="tech__group reveal">
      <p class="eyebrow tech__label">{{ group.label }}</p>
      <ul class="tech__grid">
        {% for item in group.items %}
        <li class="tech__item">
          <span class="tech__tile{% if item.mono %} tech__tile--mono{% endif %}">
            <svg aria-hidden="true" focusable="false">
              <use href="#tech-{{ item.id }}"></use>
            </svg>
          </span>
          <span class="tech__name">{{ item.name }}</span>
        </li>
        {% endfor %}
      </ul>
    </div>
    {% endfor %}
  </div>
</section>
