<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title and page.title != site.title %}{{ page.title }} &middot; {{ site.title }}{% else %}{{ site.title }} &middot; Software architect{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="keywords" content="{{ site.keywords }}">
  <meta name="author" content="{{ site.author }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

  <meta content="website" property="og:type">
  <meta content="{{ site.title }}" property="og:site_name">
  <meta content="{{ page.title | default: site.title }}" property="og:title">
  <meta content="{{ page.description | default: site.description }}" property="og:description">
  <meta content="{% if page.layout == "product" %}{{ page.url | absolute_url }}{% else %}{{ site.url }}{% endif %}" property="og:url">
  <meta content="{{ page.image | default: site.image | absolute_url }}" property="og:image">
  <meta name="twitter:card" content="{% if page.layout == "product" %}summary_large_image{% else %}summary{% endif %}">
  {% if page.layout == "product" %}
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="MicBoost — make your microphone louder on Mac">
  <meta name="twitter:title" content="{{ page.title }}">
  <meta name="twitter:description" content="{{ page.description }}">
  <meta name="twitter:image" content="{{ page.image | absolute_url }}">
  <meta name="twitter:image:alt" content="MicBoost — make your microphone louder on Mac">
  {% endif %}

  <!-- Favicon: o losango da marca (◇) com um no no centro. O .ico leva 16/32/48
       (o de 16 desenhado a parte, com traco mais grosso); fonte em favicon.svg. -->
  <link rel="icon" sizes="16x16 32x32 48x48" href="{{ "/favicon.ico" | relative_url }}">
  <link rel="icon" type="image/png" sizes="256x256" href="{{ "/favicon.png" | relative_url }}">
  <link rel="apple-touch-icon" href="{{ "/apple-touch-icon.png" | relative_url }}">

  <!-- Texto (Geist) e titulos (Newsreader 500) aparecem acima da dobra; os demais
       arquivos sao buscados sob demanda pelo unicode-range declarado em main.css. -->
  <link rel="preload" href="{{ "/fonts/geist-latin.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ "/fonts/newsreader-500-latin.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>

  <!-- Tema: precisa rodar antes da primeira pintura, senao pisca o tema errado. -->
  <script>
    (function () {
      var d = document.documentElement;
      d.classList.remove('no-js');
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') { d.setAttribute('data-theme', t); }
      } catch (e) { /* localStorage bloqueado: segue o prefers-color-scheme */ }
    })();
  </script>

  <meta name="theme-color" content="#{{ site.color.light-bg }}" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#{{ site.color.dark-bg }}" media="(prefers-color-scheme: dark)">

  <!-- Folha unica, inline: uma requisicao a menos e nada bloqueando a renderizacao.
       Alternativa externa (desativada): style.css + _layouts/style.css. -->
  <style>
    {% include css/main.css %}
    {% if page.layout == "product" %}{% include css/product.css %}{% endif %}
    {% if page.layout == "legal" %}{% include css/legal.css %}{% endif %}
  </style>
</head>
