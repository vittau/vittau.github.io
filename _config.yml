url: "https://www.vitormach.dev"
baseurl: ""   # site na raiz do dominio proprio (CNAME). Com "/" os filtros de URL
              # produzem "//img/..." — que o navegador le como protocolo-relativo.

# Site settings
title: Vitor Machado
author: Vitor Machado
email: vitor.p.mach@gmail.com
description: "Software architect and Doctor of Systems Engineering and Computer Science. Ten years building web products end to end."
keywords: "software architect,tech lead,typescript,react,next.js,node,aws,artificial intelligence,temporal logic,rio de janeiro"
image: "/favicon.png"

# Color settings (hex-codes without the leading hash-tag).
# Trocar estes valores repinta o site inteiro: _includes/css/main.css os le via Liquid.
# Os *-rgb sao o mesmo valor em decimal, usados nos rgba(); mantenha-os em sincronia
# com o hex ao lado (o filtro hex_to_rgb nao roda no GitHub Pages, por isso sao explicitos).
# Contraste medido de cada par de texto: DESIGN.md secao 2.2.
color:
  # marca: um unico acento, coral
  primary: CC6868                  # coral: decoracao, bordas, nos, item ativo
  primary-rgb: "204, 104, 104"
  primary-ink-light: A5492F        # terracota: texto/link no tema claro (AA 5.1:1)
  primary-solid-light: AD4F38      # terracota: fundo de botao com texto branco (AA 5.3:1)
  primary-ink-dark: E08A7E         # coral clareado: texto/link no tema escuro (AA 7.2:1)
  # tema escuro: carvao quente
  dark-bg: 141316
  dark-bg-rgb: "20, 19, 22"
  dark-surface: 1D1B20
  dark-text: F2EEE8
  dark-text-muted: A8A198
  # tema claro: papel
  light-bg: F4F0E8
  light-bg-rgb: "244, 240, 232"
  light-surface: FBF9F5
  light-text: 26231F
  light-text-muted: 5F5850

# Redes sociais. 'icon' e o id de um <symbol> em _includes/icons.html.
# 'handle' aparece na secao Contact; 'nav: true' repete o link na navbar.
# 'photo: true' marca as redes de fotografia, listadas a parte ("Elsewhere") no Contact.
social:
  - title: GitHub
    handle: "@vittau"
    url: https://github.com/vittau
    icon: i-github
    nav: true
  - title: LinkedIn
    handle: in/vitormach
    url: https://www.linkedin.com/in/vitormach
    icon: i-linkedin
    nav: true
  - title: Flickr
    handle: "@vitormach"
    url: https://www.flickr.com/photos/vitormach
    icon: i-flickr
    photo: true
  - title: Unsplash
    handle: "@vitormach"
    url: https://unsplash.com/@vitormach
    icon: i-unsplash
    photo: true
  - title: Instagram
    handle: "@vitor.p.mach"
    url: https://www.instagram.com/vitor.p.mach
    icon: i-instagram
    photo: true

# Build settings
markdown: kramdown
permalink: pretty

# Files not published to the site
exclude:
  - CLAUDE.md
  - DESIGN.md
